[tox]
envlist = check-copyright, ruff-check, ruff-format, docs, mypy, py3{10,11,12}
labels =
    code = py3{10}
    meta = check-copyright, ruff-check, ruff-format, docs, mypy

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest
    pytest-cov
    pytest-randomly
    pytest-lazy-fixtures
    mistune

commands =
    pytest --basetemp={envtmpdir} --doctest-modules \
        {posargs:pddl tests} \
        --cov=pddl \
        --cov-report=xml \
        --cov-report=html \
        --cov-report=term

[testenv:py{310,311,312}]
commands =
    {[testenv]commands}

[testenv:ruff-check]
skip_install = True
deps = ruff
commands = ruff check pddl tests scripts

[testenv:ruff-format]
skip_install = True
deps = ruff
commands = ruff format --check pddl tests scripts

[testenv:mypy]
deps =
    mypy
    types-click
    pytest-lazy-fixtures
commands =
    mypy pddl tests

[testenv:safety]
skipsdist = False
skip_install = False
deps = safety
commands = safety check

[testenv:vulture]
skipsdist = True
skip_install = True
deps = vulture
commands = vulture pddl scripts/whitelist.py

[testenv:docs]
skip_install = True
deps =
    mkdocs
    mkdocs-material
    markdown-include
    pymdown-extensions
commands =
    mkdocs build --clean

[testenv:docs-serve]
skip_install = True
deps =
    mkdocs
    mkdocs-material
    markdown-include
    pymdown-extensions
commands =
    mkdocs build --clean
    python -c 'print("###### Starting local server. Press Control+C to stop server ######")'
    mkdocs serve

[testenv:check-copyright]
skip_install = True
deps =
commands = python3 scripts/check_copyright.py
